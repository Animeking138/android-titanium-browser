# Builds an installable APK from a fork WITHOUT any repository secrets.
#
# Chromium does not fit on a standard GitHub-hosted runner (14 GB free disk;
# the checkout plus out/ needs roughly 100-150 GB), so this workflow defaults to
# a paid "larger runner". Change `runner` to `self-hosted` to build on your own
# machine instead - that is free, and is what upstream's build.yml defaults to.
#
# Signing uses a throwaway keystore generated by common.sh:set_keys when the
# release secrets are absent. Such an APK can be sideloaded but cannot update an
# existing install, and must never be published.

name: Build fork APK

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner (larger runners need billing enabled; self-hosted is free)'
        required: true
        type: choice
        default: 'ubuntu-16-core'
        options:
          - ubuntu-16-core   # 16 CPU / 64 GB RAM / 600 GB SSD  ~$0.064/min
          - ubuntu-8-core    #  8 CPU / 32 GB RAM / 300 GB SSD  ~$0.032/min
          - ubuntu-32-core   # 32 CPU / 128 GB RAM / 1200 GB SSD ~$0.128/min
          - self-hosted
      max_tiles:
        description: 'TITANIUM_MAX_TILES - pinned-site cap (8 = upstream default)'
        required: false
        default: '16'
      abi:
        description: 'Which ABI(s) to build (arm64 only is much faster)'
        required: true
        type: choice
        default: 'arm64'
        options:
          - arm64
          - both

# Rough cost guide on ubuntu-16-core: 1.5-3 h per build => about $6-12.
timeout-minutes: 420

permissions:
  contents: read

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-16-core' }}

    env:
      DEBIAN_FRONTEND: noninteractive
      TITANIUM_MAX_TILES: ${{ github.event.inputs.max_tiles || '16' }}
      # Keep only the requested ABI; build.sh builds armeabi-v7a first, then arm64.
      TITANIUM_ABI: ${{ github.event.inputs.abi || 'arm64' }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # The runner ships ~50 GB of preinstalled toolchains we do not need.
      # Never run this on a self-hosted runner: it would delete the host's JDKs.
      - name: Free disk space
        if: ${{ !contains(github.event.inputs.runner, 'self-hosted') }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup \
                      /usr/local/lib/android /opt/hostedtoolcache /usr/local/julia* \
                      /usr/local/share/chromium /usr/local/share/powershell /opt/az || true
          df -h /

      - name: Show build parameters
        run: |
          echo "runner      = ${{ github.event.inputs.runner }}"
          echo "max_tiles   = $TITANIUM_MAX_TILES"
          echo "abi         = $TITANIUM_ABI"
          grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn | sed 's/^/chromium    = /'
          nproc; free -h; df -h /

      # build.sh needs no secrets: set_keys falls back to an ephemeral keystore.
      - name: Build
        run: |
          chmod +x *.sh
          ./build.sh

      - name: Collect APK
        run: |
          mkdir -p dist
          cp chromium/src/out/release/*.apk dist/ 2>/dev/null || true
          cp chromium/src/out/release/*.aab dist/ 2>/dev/null || true
          ls -la dist/
          test -n "$(ls -A dist/*.apk 2>/dev/null)" || { echo "::error::no APK produced"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: titanium-${{ github.event.inputs.max_tiles || '16' }}-tiles-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Disk after build
        if: always()
        run: df -h /
        
