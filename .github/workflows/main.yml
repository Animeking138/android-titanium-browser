# Builds an installable APK from a fork WITHOUT any repository secrets.
#
# Chromium does not fit on a standard GitHub-hosted runner (ubuntu-latest has
# ~14 GB of free disk and a hard 6 h job limit; the checkout plus out/ needs
# roughly 100-150 GB), so the realistic runner choices are:
#
#   self-hosted     Free. Register your own machine under Settings > Actions >
#                   Runners. This is what upstream builds on (~2 h 15 min for
#                   both ABIs on their hardware).
#   ubuntu-*-core   GitHub "larger runners", billed per minute. They are ONLY
#                   available to organizations on the Team / Enterprise Cloud
#                   plans - on a personal account a job targeting one of these
#                   labels is never picked up. Create the runner in the org
#                   settings with exactly the label used below before selecting it.
#
# Signing: build.sh reads the release keystore from the LOCAL_TEST_JKS and
# STORE_TEST_JKS secrets (see README). When they are absent this workflow
# generates a throwaway key so the run does not die at the signing step after
# hours of compiling. Such an APK can be sideloaded but cannot update an
# existing install, and must never be published.

name: Build fork APK
run-name: Build ${{ github.event.inputs.abi }} on ${{ github.event.inputs.runner }} (max_tiles=${{ github.event.inputs.max_tiles }})

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner (self-hosted is free; ubuntu-*-core larger runners need an org with billing)'
        required: true
        type: choice
        default: 'self-hosted'
        options:
          - self-hosted
          - ubuntu-16-core   # 16 CPU / 64 GB RAM / 600 GB SSD  ~$0.064/min
          - ubuntu-8-core    #  8 CPU / 32 GB RAM / 300 GB SSD  ~$0.032/min
          - ubuntu-32-core   # 32 CPU / 128 GB RAM / 1200 GB SSD ~$0.128/min
      max_tiles:
        description: 'TITANIUM_MAX_TILES - pinned-site cap (8 = upstream default)'
        required: false
        default: '16'
      abi:
        description: 'Which ABI(s) to build (arm64 only is much faster)'
        required: true
        type: choice
        default: 'arm64'
        options:
          - arm64
          - both

permissions:
  contents: read

# One build per branch at a time. A second dispatch queues behind the running
# one instead of cancelling it: a Chromium build is hours of (possibly paid)
# runner time, so accidentally killing an in-progress build is worse than waiting.
concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner || 'self-hosted' }}
    # Rough cost guide on ubuntu-16-core: 1.5-3 h per build => about $6-12.
    # GitHub-hosted runners hard-cap a job at 360 min regardless of this value;
    # self-hosted runners may run longer.
    timeout-minutes: 420

    env:
      DEBIAN_FRONTEND: noninteractive
      TITANIUM_MAX_TILES: ${{ github.event.inputs.max_tiles || '16' }}
      # Keep only the requested ABI; build.sh builds armeabi-v7a first, then arm64.
      TITANIUM_ABI: ${{ github.event.inputs.abi || 'arm64' }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      # The runner ships ~50 GB of preinstalled toolchains we do not need.
      # Never run this on a self-hosted runner: it would delete the host's JDKs.
      - name: Free disk space
        if: ${{ !contains(github.event.inputs.runner, 'self-hosted') }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup \
                      /usr/local/lib/android /opt/hostedtoolcache /usr/local/julia* \
                      /usr/local/share/chromium /usr/local/share/powershell /opt/az || true
          df -h /

      - name: Show build parameters
        run: |
          echo "runner      = ${{ github.event.inputs.runner }}"
          echo "max_tiles   = $TITANIUM_MAX_TILES"
          echo "abi         = $TITANIUM_ABI"
          grep -m1 -o '[0-9]\+\(\.[0-9]\+\)\{3\}' vanadium/args.gn | sed 's/^/chromium    = /'
          nproc; free -h; df -h /

      # common.sh:set_keys blindly base64-decodes LOCAL_TEST_JKS / STORE_TEST_JKS
      # into keys/ and has no fallback: with the secrets unset it writes empty
      # files and apksigner fails at the very end of the build. Generate a
      # throwaway keystore here when the release secrets are absent.
      - name: Prepare signing key
        env:
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
        run: |
          if [ -n "$LOCAL_TEST_JKS" ] && [ -n "$STORE_TEST_JKS" ]; then
            echo "Using the release signing key from repository secrets."
            exit 0
          fi
          echo "::warning title=Throwaway signing key::LOCAL_TEST_JKS / STORE_TEST_JKS secrets are not set. The APK will be signed with a one-off key: it can be sideloaded but cannot update an existing install and must not be published."
          if ! command -v keytool >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends default-jre-headless
          fi
          tmp=$(mktemp -d)
          pass=$(head -c 18 /dev/urandom | base64 -w0 | tr '+/' 'xy')
          echo "::add-mask::$pass"
          # RSA: sign_aab signs with SHA256withRSA. PKCS12 needs keypass == storepass.
          keytool -genkeypair -keystore "$tmp/test.jks" -storetype PKCS12 -alias titanium \
                  -keyalg RSA -keysize 4096 -validity 10000 \
                  -storepass "$pass" -keypass "$pass" \
                  -dname "CN=Titanium Browser fork build, OU=GitHub Actions, O=Titanium"
          printf 'keyAlias=titanium\nkeyPassword=%s\nstorePassword=%s\n' "$pass" "$pass" > "$tmp/local.properties"
          # Single-line base64: set_keys feeds the value through `echo $VAR | base64 -d`.
          echo "LOCAL_TEST_JKS=$(base64 -w0 "$tmp/local.properties")" >> "$GITHUB_ENV"
          echo "STORE_TEST_JKS=$(base64 -w0 "$tmp/test.jks")" >> "$GITHUB_ENV"
          rm -rf "$tmp"

      - name: Build
        env:
          # Real release secrets win; otherwise the throwaway key exported above.
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS || env.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS || env.STORE_TEST_JKS }}
        run: |
          chmod +x *.sh
          ./build.sh

      - name: Collect APK
        run: |
          mkdir -p dist
          cp chromium/src/out/release/*.apk dist/ 2>/dev/null || true
          cp chromium/src/out/release/*.aab dist/ 2>/dev/null || true
          ls -la dist/
          test -n "$(ls -A dist/*.apk 2>/dev/null)" || { echo "::error::no APK produced"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: titanium-${{ github.event.inputs.max_tiles || '16' }}-tiles-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

      - name: Disk after build
        if: always()
        run: df -h /
